name: Auto Update HD Movies Playlist

on:
  schedule:
    # Runs everyday at 00:00 UTC (6:00 AM Bangladesh Time)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  update-movies:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Auto-Updater Script
        run: |
          python scripts/auto_update_movies.py

      - name: Commit and Push Changes if Updated
        run: |
          git config --global user.name "IreenTV Bot"
          git config --global user.email "bot@ireentv.com"
          
          git add "HD Movies.m3u"
          
          if git diff --staged --quiet; then
            echo "No new movies found today. Catalog is up to date."
          else
            git commit -m "Auto-update movie playlist [skip ci]"
            git push
            echo "Successfully pushed new movies to HD Movies.m3u!"
          fi
